spring.application.name=HospitalManagementAPI
server.port=8090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_jakarta}
spring.datasource.username=${DB_USER:hospital}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Swagger desactivado salvo que se pida (SWAGGER_ENABLED=true en local)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Secreto HMAC para firmar los JWT (min. 32 caracteres)
jwt.secret=${JWT_SECRET}
