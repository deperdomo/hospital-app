<div class="body-doctores">
  <app-left-nav />

  @if (usuarioLogeado) {
  <app-secundary-nav [titulo]="'Doctores disponibles'" />
  } @else {
  <!-- Sin sesión: volver al inicio y título. En móvil deja sitio al botón de menú fijo de app-left-nav. -->
  <header class="bg-white border-b border-line-subtle">
    <div class="flex items-center gap-3 min-h-[4.5rem] py-3 pl-[4.5rem] pr-4 sm:pl-6 lg:pl-8">
      <a href="/" aria-label="Volver al inicio" class="btn-icon flex-none border-line text-ink-700">
        <svg class="w-6 h-6 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true" focusable="false">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
      </a>
      <h1 class="text-h3 sm:text-h2 lg:text-h1 text-ink-900 break-words min-w-0">Doctores disponibles</h1>
    </div>
  </header>
  }
  <main id="contenido" tabindex="-1" class="conenido min-w-0 px-4 sm:px-6 lg:px-8 py-6 lg:py-8">
    <div class="mx-auto max-w-content">
      <h2 class="sr-only">Listado de doctores</h2>
      <app-lista-doctores />
    </div>
  </main>

</div>
