<header class="flex items-center justify-between pt-6 pb-6">
    <app-title-jakarta />
    <app-user-nav />
</header>

<main id="contenido" tabindex="-1" class="flex justify-center items-center w-full min-h-screen bg-surface-canvas px-4 py-10 sm:px-6">
    <div class="card flex flex-col p-6 sm:p-8 w-full max-w-lg">

        <button type="button" aria-label="Volver" (click)="navigateToProfile()"
            class="btn-icon self-start mb-6 rounded-pill border-line-strong">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"> 
                <g fill="none"> 
                    <path d="M24 0v24H0V0zM12.593 23.258l-.011.002l-.071.035l-.02.004l-.014-.004l-.071-.035q-.016-.005-.024.005l-.004.01l-.017.428l.005.02l.01.013l.104.074l.015.004l.012-.004l.104-.074l.012-.016l.004-.017l-.017-.427q-.004-.016-.017-.018m.265-.113l-.013.002l-.185.093l-.01.01l-.003.011l.018.43l.005.012l.008.007l.201.093q.019.005.029-.008l.004-.014l-.034-.614q-.005-.019-.02-.022m-.715.002a.02.02 0 0 0-.027.006l-.006.014l-.034.614q.001.018.017.024l.015-.002l.201-.093l.01-.008l.004-.011l.017-.43l-.003-.012l-.01-.01z" /> 
                    <path fill="currentColor" d="M3.636 11.293a1 1 0 0 0 0 1.414l5.657 5.657a1 1 0 0 0 1.414-1.414L6.757 13H20a1 1 0 1 0 0-2H6.757l3.95-3.95a1 1 0 0 0-1.414-1.414z" /> 
                </g>
            </svg>
        </button>

        <div>
            <h1 class="text-h2 text-ink-900 mb-6">Editar Perfil</h1>
            @if (cuentaDemo) {
              <p id="aviso-demo-editar" class="alert-info mb-5">{{ avisoDemo }}</p>
            }

            <div id="editar-perfil-error" role="alert">
                @if (errorMessage) {
                    <p class="alert-error mb-5">{{ errorMessage }}</p>
                }
            </div>
            <div role="status">
                @if (successMessage) {
                    <p class="alert-success mb-5">{{ successMessage }}</p>
                }
            </div>
            
            @if (usuarios) {
                <div class="mb-5">
                    <label for="nombre" class="field-label">Nombre</label>
                    <input type="text" [(ngModel)]="usuario.nombre" name="nombre" id="nombre" autocomplete="given-name" placeholder="Introduzca el nombre"
                        class="input" />
                </div>

                <div class="mb-5">
                    <label for="apellidos" class="field-label">Apellidos</label>
                    <input type="text" [(ngModel)]="usuario.apellidos" name="apellidos" id="apellidos" autocomplete="family-name" placeholder="Introduzca los apellidos"
                        class="input" />
                </div>

                <div class="mb-5">
                    <label for="email" class="field-label">Email</label>
                    <input type="email" [(ngModel)]="usuario.email" name="email" id="email" autocomplete="email" placeholder="email@ejemplo.com"
                        class="input" />
                </div>

                <div class="mb-5">
                    <label for="telefono" class="field-label">Número de Contacto</label>
                    <input type="text" [(ngModel)]="usuario.telefono" name="telefono" id="telefono" autocomplete="tel" placeholder="Introduzca su número de teléfono"
                        class="input" />
                </div>

                <div class="mb-5">
                    <label for="localidad" class="field-label">Localidad</label>
                    <input type="text" [(ngModel)]="usuario.localidad" name="localidad" id="localidad" autocomplete="address-level2" placeholder="Introduzca la localidad"
                        class="input" />
                </div>

                <div class="mb-5">
                    <label for="direccion" class="field-label">Dirección</label>
                    <input type="text" [(ngModel)]="usuario.direccion" name="direccion" id="direccion" autocomplete="street-address" placeholder="Introduzca la dirección"
                        class="input" />
                </div>
            } @else {
                <div class="mb-5">
                    <label for="nombre" class="field-label">Nombre</label>
                    <input type="text" [(ngModel)]="doctor.nombre" name="nombre" id="nombre" autocomplete="given-name" placeholder="Introduzca el nombre"
                        class="input" />
                </div>

                <div class="mb-5">
                    <label for="apellidos" class="field-label">Apellidos</label>
                    <input type="text" [(ngModel)]="doctor.apellidos" name="apellidos" id="apellidos" autocomplete="family-name" placeholder="Introduzca los apellidos"
                        class="input" />
                </div>

                <div class="mb-5">
                    <label for="email" class="field-label">Email</label>
                    <input type="email" [(ngModel)]="doctor.email" name="email" id="email" autocomplete="email" placeholder="email@ejemplo.com"
                        class="input" />
                </div>

                <div class="mb-5">
                    <label for="precioConsulta" class="field-label">Precio Consulta</label>
                    <input type="text" [(ngModel)]="doctor.precioConsulta" name="precioConsulta" id="precioConsulta" placeholder="Introduzca el precio de la consulta"
                        class="input" />
                </div>

                <div class="mb-5">
                    <label for="localidad" class="field-label">Localidad</label>
                    <input type="text" [(ngModel)]="doctor.localidad" name="localidad" id="localidad" autocomplete="address-level2" placeholder="Introduzca la localidad"
                        class="input" />
                </div>

                <div class="mb-5">
                    <label for="direccion" class="field-label">Dirección</label>
                    <input type="text" [(ngModel)]="doctor.direccion" name="direccion" id="direccion" autocomplete="street-address" placeholder="Introduzca la dirección"
                        class="input" />
                </div>

                <div class="mb-5">
                    <label for="sexo" class="field-label">Sexo</label>
                    <input type="text" [(ngModel)]="doctor.sexo" name="sexo" id="sexo" placeholder="Introduzca el sexo"
                        class="input" />
                </div>
            }
        </div>

        <div class="flex justify-end mt-3">
            <button type="button" class="btn-primary w-full sm:w-auto sm:px-10" (click)="editar()" [disabled]="cuentaDemo" [attr.aria-describedby]="cuentaDemo ? 'aviso-demo-editar' : null">Confirmar</button>
        </div>
    </div>
</main>
