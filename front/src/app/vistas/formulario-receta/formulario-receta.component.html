<main id="contenido" tabindex="-1" class="flex justify-center items-center min-h-screen bg-surface-canvas px-4 py-10 sm:px-6">
  <div class="card flex flex-col p-6 sm:p-8 w-full max-w-lg">
    <p class="text-h2 text-brand-600 mb-6 text-center" aria-hidden="true">Jakarta</p>
    <h1 class="sr-only">Nueva receta</h1>
   
    <form *ngIf="usuario.id" class="space-y-5" (ngSubmit)="altaReceta(usuario.id,historialMedico.id,cita.id)">
     
      <div class="grid gap-5 md:grid-cols-2 md:gap-x-4">
        <!-- <input type="hidden">{{receta.usuario.id}}
        <div>{{receta.usuario.id}}</div>
        <div>{{receta.cita.id}}</div>
        <div>{{receta.historialMedico.id}}</div>
        <input type="hidden">{{receta.cita.id}}
        
        <input type="hidden">{{receta.historialMedico.id}} -->
        <!-- Nombre del Medicamento -->
        <div>
          <label  for="nombre_medicamento" class="field-label">
            Nombre del Medicamento
          </label>
          <input
            type="text"
            id="nombre_medicamento"
            name="nombre_medicamento"
            [(ngModel)]="receta.nombre_medicamento"
            class="input"
            required
          />
        </div>

        <!-- Dosis -->
        <div>
          <label for="dosis" class="field-label">
            Dosis
          </label>
          <input
            type="text"
            id="dosis"
            name="dosis"
            [(ngModel)]="receta.dosis"
            class="input"
            required
          />
        </div>

        <!-- Frecuencia -->
        <div>
          <label for="frecuencia" class="field-label">
            Frecuencia
          </label>
          <input
            type="text"
            id="frecuencia"
            name="frecuencia"
            [(ngModel)]="receta.frecuencia"
            class="input"
            required
          />
        </div>

        <!-- Fecha de Inicio -->
        <div>
          <label for="fechaInicio" class="field-label">
            Fecha de Inicio
          </label>
          <input
            type="date"
            id="fechaInicio"
            name="fechaInicio"
            [(ngModel)]="receta.fechaInicio"
            class="input"
            required
          />
        </div>

        <!-- Fecha de Finalización -->
        <div>
          <label for="fechaFin" class="field-label">
            Fecha de Finalización
          </label>
          <input
            type="date"
            id="fechaFin"
            name="fechaFin"
            [(ngModel)]="receta.fechaFin"
            class="input"
            required
          />
        </div>
      </div>

      <!-- Instrucciones -->
      <div>
        <label for="instrucciones" class="field-label">
          Instrucciones
        </label>
        <input
          type="text"
          id="instrucciones"
          name="instrucciones"
          [(ngModel)]="receta.instrucciones"
          class="input"
          required
        />
      </div>

      <div class="flex justify-end pt-1">
        <button type="submit" class="btn-primary w-full sm:w-auto sm:px-10">
          Guardar Informe
        </button>
      </div>
    </form>
  
  <!-- <div> historial:{{historialMedico.id}}cita:{{cita.id}}usuario:{{usuario.id}}</div> -->
  </div>
</main>
