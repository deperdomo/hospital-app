<main id="contenido" tabindex="-1" class="flex justify-center items-center min-h-screen bg-surface-canvas px-4 py-10 sm:px-6">
  <div class="card flex flex-col p-6 sm:p-8 w-full max-w-lg">
    <button type="button" aria-label="Volver" (click)="navigateToProfile()"
      class="btn-icon self-start mb-6 rounded-pill border-line-strong">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <g fill="none">
          <path
            d="M24 0v24H0V0zM12.593 23.258l-.011.002l-.071.035l-.02.004l-.014-.004l-.071-.035q-.016-.005-.024.005l-.004.01l-.017.428l.005.02l.01.013l.104.074l.015.004l.012-.004l.104-.074l.012-.016l.004-.017l-.017-.427q-.004-.016-.017-.018m.265-.113l-.013.002l-.185.093l-.01.01l-.003.011l.018.43l.005.012l.008.007l.201.093q.019.005.029-.008l.004-.014l-.034-.614q-.005-.019-.02-.022m-.715.002a.02.02 0 0 0-.027.006l-.006.014l-.034.614q.001.018.017.024l.015-.002l.201-.093l.01-.008l.004-.011l.017-.43l-.003-.012l-.01-.01z" />
          <path fill="currentColor"
            d="M3.636 11.293a1 1 0 0 0 0 1.414l5.657 5.657a1 1 0 0 0 1.414-1.414L6.757 13H20a1 1 0 1 0 0-2H6.757l3.95-3.95a1 1 0 0 0-1.414-1.414z" />
        </g>
      </svg>
    </button>
    <p class="text-h2 text-brand-600 mb-6 text-center" aria-hidden="true">Jakarta</p>
    <h1 class="sr-only">Nuevo historial médico</h1>
    @if (!recetaExistente) {
      @if (usuario.id) {
        <form class="space-y-5" (ngSubmit)="crearHistorial(usuario.id,cita.id)">
          <input type="hidden">{{historialMedico.usuario.id}}
          <div>
            <label for="diagnostico" class="field-label">
              Diagnóstico
            </label>
            <input [(ngModel)]="historialMedico.diagnostico" id="diagnostico" name="diagnostico" type="text"
              class="input"
              required />
          </div>

          <div>
            <label for="tratamiento" class="field-label">
              Tratamiento
            </label>
            <input [(ngModel)]="historialMedico.tratamiento" id="tratamiento" name="tratamiento" type="text"
              class="input"
              required />
          </div>

          <div>
            <label for="fecha" class="field-label">
              Fecha del Historial Médico
            </label>
            <input [(ngModel)]="historialMedico.fecha" type="date" id="fecha" name="fecha"
              class="input"
              required />
          </div>

          <div class="flex justify-end pt-1">
            <button type="submit" class="btn-primary w-full sm:w-auto sm:px-10">
              Continuar
            </button>
          </div>

        </form>
      }
    } @else {
      <p class="rounded-control border border-info-200 bg-info-50 px-4 py-3 text-body text-info-700">Esta cita ya posee una receta</p>
    }
  </div>
</main>
