
<form (ngSubmit)="onSubmit()" class="my-6 ml-4 sm:mx-6">

  <h1 class="text-h2 text-ink-900 mb-2">Ingresar Detalles</h1>
  <p class="mb-6 text-meta text-ink-600">Todos los campos son obligatorios (<span aria-hidden="true">*</span><span class="sr-only">marcados con asterisco</span>).</p>

  <div class="mb-5">
    <label for="email" class="field-label">Email del Paciente <span class="text-danger-700" aria-hidden="true">*</span></label>
    <input type="email" name="email" id="email" autocomplete="email" placeholder="email@ejemplo.com"
      class="input"
      [(ngModel)]="cita.email" required />
  </div>

  <div class="mb-5">
    <label for="contacto" class="field-label">Número de Contacto <span class="text-danger-700" aria-hidden="true">*</span></label>
    <input type="tel" name="contacto" id="contacto" autocomplete="tel" placeholder="Introduzca su número de teléfono"
      class="input"
      [(ngModel)]="cita.telefono" required />
  </div>

  <div class="pb-6 border-b border-line">
    <label for="motivo" class="field-label">Motivo <span class="text-danger-700" aria-hidden="true">*</span></label>
    <input type="text" name="motivo" id="motivo" placeholder="Motivo de su cita"
      class="input"
      [(ngModel)]="cita.motivo" required />
  </div>

  <h2 class="text-h3 text-ink-900 mt-6 mb-3">Detalles de pago</h2>
  <fieldset>
  <legend class="field-label">Forma de pago <span class="text-danger-700" aria-hidden="true">*</span></legend>

  <div class="choice-row">
    <input id="default-radio-1" type="radio" value="Paypal" name="formaPago" [(ngModel)]="cita.formaPago" required class="choice">
    <label for="default-radio-1" class="choice-label">Paypal</label>
  </div>
  <div class="choice-row">
    <input id="default-radio-2" type="radio" value="Tarjeta de crédito" name="formaPago" [(ngModel)]="cita.formaPago" class="choice">
    <label for="default-radio-2" class="choice-label">Tarjeta de crédito</label>
  </div>
  <div class="choice-row">
    <input id="default-radio-3" type="radio" value="Efectivo" name="formaPago" [(ngModel)]="cita.formaPago" class="choice">
    <label for="default-radio-3" class="choice-label">Efectivo</label>
  </div>
  </fieldset>

  <div class="mt-6">
    <button type="submit" class="btn-primary w-full">
      Confirmar
    </button>
  </div>

</form>
