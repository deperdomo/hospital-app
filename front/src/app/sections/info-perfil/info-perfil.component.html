<div class="card p-5 flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-5">
    @if (usuarios) {
        <img [src]="'img/usuarios/' + usuario.fotoPerfil" width="96" height="96" alt=""
            class="w-20 h-20 sm:w-24 sm:h-24 flex-none rounded-full object-cover bg-brand-50">
        <div class="min-w-0">
            <p class="text-h3 text-ink-900 break-words">{{ usuario.nombre }} {{ usuario.apellidos }}</p>
            <p class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-2 text-ink-600">
                <span class="tag capitalize">{{ usuario.rol }}</span>
                <span class="break-words">{{ usuario.localidad }}, {{ usuario.provincia }}</span>
            </p>
        </div>
    }
    @else  {
        <img [src]="'img/doctores/' + doctor.fotoPerfil" width="96" height="96" alt=""
            class="w-20 h-20 sm:w-24 sm:h-24 flex-none rounded-full object-cover bg-brand-50">
        <div class="min-w-0">
            <p class="text-h3 text-ink-900 break-words">{{ doctor.nombre }} {{ doctor.apellidos }}</p>
            <p class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-2 text-ink-600">
                <span class="tag">{{ doctor.especialidad.nombre }}</span>
                <span class="break-words">{{ doctor.localidad }}, {{ doctor.provincia }}</span>
            </p>
        </div>
    }
</div>
