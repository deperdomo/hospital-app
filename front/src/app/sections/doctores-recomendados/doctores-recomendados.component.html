<div class="container-bottom mt-4">
  <div class="container-header flex flex-col sm:flex-row items-center justify-between mb-4 gap-2 sm:gap-0">
      <h2 class="titulos text-xl sm:text-2xl font-semibold text-center sm:text-left mb-4">Doctores Recomendados</h2>
      <a href="/listaDoctores" class="enlace text-brand text-sm sm:text-base">Ver todos<span class="sr-only"> los doctores</span> <span aria-hidden="true">&gt;</span></a>
  </div>

  <div class="cont-info-doctors flex flex-wrap justify-center sm:justify-between gap-4">
    @for (doctor of doctores; track $index) {
      <app-info-doctor [doctor]="doctor" class="info-doctor"></app-info-doctor>
    }
  </div>
</div>
