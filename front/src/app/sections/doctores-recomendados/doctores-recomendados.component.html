<!-- Contenedor de consulta: el nº de columnas depende del ancho de la sección, no de la ventana -->
<section aria-labelledby="recomendados-titulo" class="[container-type:inline-size]">
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <h2 id="recomendados-titulo" class="section-title">Doctores recomendados</h2>
      <p class="mt-1 text-ink-600">Los más votados por otros pacientes.</p>
    </div>
    <a href="/listaDoctores" routerLink="/listaDoctores" class="btn-ghost btn-sm">
      Ver todos<span class="sr-only"> los doctores</span>
      <svg class="w-4 h-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
    </a>
  </div>

  <!-- Se piden 4: caben 4 desde 67.75rem; con 3 columnas (50.5–67.75rem) se oculta el 4º para no dejar uno suelto; en una columna (móvil, <33.25rem) solo 2 -->
  <ul role="list" class="mt-6 grid gap-5 grid-cols-[repeat(auto-fill,minmax(min(100%,16rem),1fr))] [@container(min-width:50.5rem)_and_(max-width:67.74rem)]:[&>li:nth-child(4)]:hidden [@container(max-width:33.24rem)]:[&>li:nth-child(n+3)]:hidden">
    @for (doctor of doctores; track doctor.id) {
      <li class="min-w-0"><app-info-doctor [doctor]="doctor" class="h-full" /></li>
    }
  </ul>
</section>
