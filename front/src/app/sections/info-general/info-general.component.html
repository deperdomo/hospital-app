<section class="card p-5 sm:p-6" aria-labelledby="ajustes-titulo">
  <h2 id="ajustes-titulo" class="text-h3 text-ink-900">Ajustes de la cuenta</h2>

  <div class="mt-4 divide-y divide-line-subtle border-t border-line-subtle">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 py-4">
      <div>
        <p class="font-medium text-ink-900">Contraseña</p>
        <p class="text-meta text-ink-600">Cámbiala si crees que alguien más la conoce.</p>
        @if (cuentaDemo) {
          <p id="aviso-demo-password" class="mt-1 text-meta text-ink-700">No disponible en la cuenta de demostración.</p>
        }
      </div>
      @if (cuentaDemo) {
        <button type="button" class="btn-secondary btn-sm self-start sm:self-auto" disabled aria-describedby="aviso-demo-password">Cambiar contraseña</button>
      } @else {
        <a href="/editarPassword" class="btn-secondary btn-sm self-start sm:self-auto" id="openModalBtn">Cambiar contraseña</a>
      }
    </div>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pt-4">
      <div>
        <p class="font-medium text-ink-900">Notificaciones</p>
        <p class="text-meta text-ink-600">Avisos sobre tus citas.</p>
      </div>
      <!-- Interruptor: la casilla nativa (oculta) da el nombre y el estado; el carril es su hermano (peer). -->
      <label class="inline-flex items-center gap-3 min-h-touch cursor-pointer self-start sm:self-auto">
        <span class="text-body text-ink-700">Activar notificaciones</span>
        <input type="checkbox" class="sr-only peer" />
        <span aria-hidden="true"
          class="relative inline-block w-11 h-6 flex-none rounded-pill bg-ink-400 transition-colors duration-200
                 peer-checked:bg-brand-500 peer-focus-visible:outline peer-focus-visible:outline-[3px] peer-focus-visible:outline-offset-2 peer-focus-visible:outline-brand-600
                 after:absolute after:left-0.5 after:top-0.5 after:h-5 after:w-5 after:rounded-full after:bg-white after:shadow-card after:transition-transform after:duration-200
                 peer-checked:after:translate-x-5"></span>
      </label>
    </div>
  </div>
</section>
