<!-- Pestañas del perfil sobre el fondo de la página (antes iban en una banda blanca a todo el ancho).
     La pestaña activa se marca con aria-current y el estilo cuelga de él: texto brand-700 en negrita
     y filete inferior de 3 px (no depende solo del color). -->
<nav aria-label="Secciones del perfil" class="border-b border-line">
  <ul class="flex flex-wrap gap-x-2 -mb-px">
    <li>
      <a href="/perfil" [attr.aria-current]="selectedGeneral ? 'page' : null" class="pestana">General</a>
    </li>
    <li>
      <a href="/perfilHistorial" [attr.aria-current]="selectedGeneral ? null : 'page'" class="pestana">Historial de citas</a>
    </li>
  </ul>
</nav>
