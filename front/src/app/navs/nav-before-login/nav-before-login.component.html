<header class="bg-white border-b border-line-subtle">
  <div class="flex items-center justify-between gap-2 min-h-[4rem] py-2 pr-3 sm:pr-6">
    <!-- En móviles estrechos (<380px) solo el icono: la palabra no deja sitio a los dos botones -->
    <app-title-jakarta class="max-[379px]:[&_span]:sr-only" />
    <nav aria-label="Acceso de usuarios" class="flex flex-wrap items-center justify-end gap-1.5 sm:gap-2">
      <!-- Cuentas demo: en móvil van en una segunda fila, con texto corto -->
      <div class="flex gap-1.5 sm:gap-2 max-sm:order-last">
        <a href="/login?demo=paciente" class="btn-ghost btn-sm px-2.5 sm:px-4"><span class="sm:hidden">Demo paciente</span><span class="max-sm:hidden">Entrar como paciente</span></a>
        <a href="/login?demo=doctor" class="btn-ghost btn-sm px-2.5 sm:px-4"><span class="sm:hidden">Demo doctor</span><span class="max-sm:hidden">Entrar como doctor</span></a>
      </div>
      <div class="flex gap-1.5 sm:gap-2">
        <a href="/login" routerLink="/login" class="btn-secondary btn-sm px-2.5 sm:px-4">Iniciar sesión</a>
        <a href="/registro" routerLink="/registro" class="btn-primary btn-sm px-2.5 sm:px-4">Registrarse</a>
      </div>
    </nav>
  </div>
</header>
