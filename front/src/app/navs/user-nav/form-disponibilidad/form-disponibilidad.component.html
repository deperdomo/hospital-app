<dialog appDialog (dialogCancel)="enviarEstado()" aria-labelledby="disponibilidad-titulo">
<div class="modal-backdrop z-50 flex items-center justify-center overflow-y-auto p-4 backdrop-blur-sm">
    <div class="modal-panel max-h-[calc(100vh-2rem)] overflow-y-auto">
        <button (click)="enviarEstado()" type="button" aria-label="Cerrar" class="btn-icon absolute right-3 top-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" aria-hidden="true" focusable="false">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>

        <h2 id="disponibilidad-titulo" class="modal-title pr-12 mb-6">Disponibilidad del Doctor</h2>

        <form (ngSubmit)="onSubmit()" class="space-y-5">
            <input type="hidden" name="doctor" [value]="doctor">

            <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 sm:gap-x-4">
                <!-- Hora de inicio -->
                <div>
                    <label for="disp-hora-inicio" class="field-label">Hora de inicio</label>
                    <input id="disp-hora-inicio"
                        type="time"
                        name="hora_inicio"
                        required
                        [(ngModel)]="disponibilidadAntigua.horaInicio"
                        class="input"
                        (input)="validateMinutes($event)">
                </div>

                <!-- Hora de fin -->
                <div>
                    <label for="disp-hora-fin" class="field-label">Hora de fin</label>
                    <input id="disp-hora-fin"
                        type="time"
                        name="hora_fin"
                        required
                        [(ngModel)]="disponibilidadAntigua.horaFin"
                        class="input"
                        (input)="validateMinutes($event)">
                </div>
            </div>

            <!-- Estado -->
            <div>
                <label for="disp-estado" class="field-label">Estado</label>
                <select id="disp-estado"
                    name="estado"
                    required
                    [(ngModel)]="disponibilidadAntigua.estado"
                    class="input">
                    <option value="" disabled [selected]="!isDisponibilidadAntigua">Seleccione un estado</option>
                    <option
                        *ngFor="let estado of ['disponible', 'no disponible', 'vacaciones']"
                        [value]="estado"
                        [selected]="estado === disponibilidadAntigua.estado">
                        {{ estado | titlecase }}
                    </option>
                </select>
            </div>

            <!-- Comentarios -->
            <div>
                <label for="disp-comentarios" class="field-label">Comentarios</label>
                <textarea id="disp-comentarios"
                    name="comentarios"
                    rows="3"
                    [(ngModel)]="disponibilidadAntigua.comentarios"
                    class="input-textarea"
                    placeholder="Agregue comentarios adicionales..."></textarea>
            </div>

            <!-- Botón de enviar -->
            <div class="modal-actions">
                <button type="submit" class="btn-primary w-full sm:w-auto">
                    {{ isDisponibilidadAntigua ? 'Actualizar' : 'Crear' }} Disponibilidad
                </button>
            </div>
        </form>
    </div>
</div>
</dialog>
