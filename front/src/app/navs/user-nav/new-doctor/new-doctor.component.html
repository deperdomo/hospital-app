<dialog appDialog (dialogCancel)="enviarEstado()" aria-labelledby="new-doctor-titulo">
<div class="modal-backdrop z-50 flex items-center justify-center overflow-y-auto p-4 backdrop-blur-sm">
  
    <div class="modal-panel max-w-2xl max-h-[calc(100vh-2rem)] overflow-y-auto">
      <button type="button"
        class="btn-icon absolute right-3 top-3"
        (click)="enviarEstado()"
        aria-label="Cerrar"
      >
        <span aria-hidden="true">✕</span>
      </button>
      <h2 id="new-doctor-titulo" class="modal-title pr-12">
        Registro de Médico
      </h2>
  
      <p class="mt-2 mb-5 text-meta text-ink-600">Todos los campos son obligatorios (<span aria-hidden="true">*</span><span class="sr-only">marcados con asterisco</span>).</p>
      <form ngNativeValidate (ngSubmit)="onSubmit()" #doctorForm="ngForm" class="grid grid-cols-1 gap-5 sm:grid-cols-2 sm:gap-x-4">
        <!-- Columna Izquierda -->
        <div>
          <label for="nombre" class="field-label">Nombre <span class="text-danger-700" aria-hidden="true">*</span></label>
          <input type="text" name="nombre" id="nombre" placeholder="Nombre del médico" 
                 [(ngModel)]="doctor.nombre" required
                 class="input">
        </div>
  
        <div>
          <label for="apellidos" class="field-label">Apellidos <span class="text-danger-700" aria-hidden="true">*</span></label>
          <input type="text" name="apellidos" id="apellidos" placeholder="Apellidos del médico" 
                 [(ngModel)]="doctor.apellidos" required
                 class="input">
        </div>
  
        <div>
          <label for="username" class="field-label">Nombre de usuario <span class="text-danger-700" aria-hidden="true">*</span></label>
          <input type="text" name="username" id="username" autocomplete="off" placeholder="Nombre de usuario" 
                 [(ngModel)]="doctor.username" required
                 class="input">
        </div>
  
        <div>
          <label for="email" class="field-label">Email <span class="text-danger-700" aria-hidden="true">*</span></label>
          <input type="email" name="email" id="email" placeholder="ejemplo@clinica.com" 
                 [(ngModel)]="doctor.email" required
                 class="input">
        </div>
  
        <div>
          <label for="especialidad" class="field-label">Especialidad <span class="text-danger-700" aria-hidden="true">*</span></label>
          <select name="especialidad" id="especialidad" [(ngModel)]="doctor.especialidad.id" required
                  class="input">
            <option value="" disabled selected>Seleccione especialidad</option>
            <option *ngFor="let esp of especialidades" [value]="esp.id">{{esp.nombre}}</option>
          </select>
        </div>
  
        <div>
          <label for="precioConsulta" class="field-label">Precio Consulta (€) <span class="text-danger-700" aria-hidden="true">*</span></label>
          <input type="number" name="precioConsulta" id="precioConsulta" placeholder="Ej: 50" 
                 [(ngModel)]="doctor.precioConsulta" required
                 class="input">
        </div>
  
        <!-- Columna Derecha -->
        <div>
          <label for="experiencia" class="field-label">Años de Experiencia <span class="text-danger-700" aria-hidden="true">*</span></label>
          <input type="number" name="experiencia" id="experiencia" placeholder="Ej: 5" 
                 [(ngModel)]="doctor.experiencia" required
                 class="input">
        </div>
  
        <div>
          <label for="provincia" class="field-label">Provincia <span class="text-danger-700" aria-hidden="true">*</span></label>
          <input type="text" name="provincia" id="provincia" placeholder="Ej: Madrid" 
                 [(ngModel)]="doctor.provincia" required
                 class="input">
        </div>
  
        <div>
          <label for="localidad" class="field-label">Localidad <span class="text-danger-700" aria-hidden="true">*</span></label>
          <input type="text" name="localidad" id="localidad" placeholder="Ej: Centro" 
                 [(ngModel)]="doctor.localidad" required
                 class="input">
        </div>
  
        <div>
          <label for="direccion" class="field-label">Dirección <span class="text-danger-700" aria-hidden="true">*</span></label>
          <input type="text" name="direccion" id="direccion" placeholder="Dirección consulta" 
                 [(ngModel)]="doctor.direccion" required
                 class="input">
        </div>
  
        <div>
          <label for="password" class="field-label">Contraseña <span class="text-danger-700" aria-hidden="true">*</span></label>
          <input type="password" name="password" id="password" autocomplete="new-password" placeholder="••••••••" 
                 [(ngModel)]="doctor.password" required
                 class="input">
        </div>
  
        <div>
          <label for="sexo" class="field-label">Sexo <span class="text-danger-700" aria-hidden="true">*</span></label>
          <select name="sexo" id="sexo" [(ngModel)]="doctor.sexo" required
                  class="input">
            <option value="" disabled selected>Seleccione sexo</option>
            <option value="masculino">Masculino</option>
            <option value="femenino">Femenino</option>

          </select>
        </div>
  
        <!-- Mensaje de error -->
        <div class="sm:col-span-2 -mt-5" id="new-doctor-error" role="alert">
          @if (errorMessage) {
          <p class="alert-error mt-5">{{ errorMessage }}</p>
          }
        </div>
  
        <!-- Botón de Registro -->
        <div class="modal-actions sm:col-span-2 mt-1">
          <button type="submit" class="btn-primary w-full sm:w-auto">
            Registrar Médico
          </button>
        </div>
      </form>
    </div>
  </div>
</dialog>
