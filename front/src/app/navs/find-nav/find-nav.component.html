<form role="search" aria-label="Buscar doctores" (ngSubmit)="buscarDoctores()"
  class="grid gap-4 sm:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto] sm:items-end">
  <div class="min-w-0">
    <label for="buscar-especialidad" class="field-label">Especialidad</label>
    <div class="relative">
      <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-ink-500">
        <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" aria-hidden="true" focusable="false">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="svg.buscar" />
        </svg>
      </span>
      <input id="buscar-especialidad" name="especialidad" type="text" class="input pl-10" placeholder="Ej. Pediatría"
        autocomplete="off" [(ngModel)]="especialidad">
    </div>
  </div>
  <div class="min-w-0">
    <label for="buscar-localidad" class="field-label">Localidad</label>
    <div class="relative">
      <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-ink-500">
        <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" aria-hidden="true" focusable="false">
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="svg.localidad" />
        </svg>
      </span>
      <input id="buscar-localidad" name="localidad" type="text" class="input pl-10" placeholder="Ej. Madrid"
        autocomplete="address-level2" [(ngModel)]="localidad">
    </div>
  </div>
  <button type="submit" class="btn-primary w-full sm:w-auto">Buscar doctores</button>
</form>
