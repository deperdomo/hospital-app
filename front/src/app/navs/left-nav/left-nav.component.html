<!-- Botón de menú (móvil) -->
<button #botonMenu type="button" (click)="toggleMobileMenu()"
  class="btn-icon sm:hidden fixed top-4 left-4 z-20 bg-white border-line text-brand-700 shadow-card hover:bg-brand-50 hover:text-brand-700"
  aria-label="Abrir menú" aria-controls="menu-lateral" [attr.aria-expanded]="mobileMenuOpen">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" fill="none" viewBox="0 0 24 24"
    stroke="currentColor" aria-hidden="true" focusable="false">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
  </svg>
</button>

<!-- Velo detrás del menú móvil abierto -->
<div *ngIf="mobileMenuOpen" (click)="toggleMobileMenu()"
  class="fixed inset-0 z-30 bg-ink-900/50 sm:hidden transition-opacity duration-300"></div>

<!-- Navegación lateral: desde sm es una columna blanca a toda la altura de la página (el host, ver CSS)
     con el menú pegado arriba (sticky, alto de la ventana); en móvil, panel deslizante fijo. -->
<aside id="menu-lateral" [attr.inert]="isMobile && !mobileMenuOpen ? '' : null"
  class="fixed top-0 left-0 z-40 flex flex-col h-full w-[min(18rem,85vw)] px-4 py-6 overflow-y-auto bg-white border-r border-line-subtle transform transition-transform duration-300
         sm:sticky sm:h-screen sm:w-full sm:border-r-0"
  [ngClass]="mobileMenuOpen ? 'translate-x-0 shadow-overlay' : '-translate-x-full sm:translate-x-0'">
  <!-- Cerrar (móvil) -->
  <button type="button" (click)="toggleMobileMenu()" class="btn-icon absolute top-4 right-3 sm:hidden"
    aria-label="Cerrar menú">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Logo -->
  <div class="px-2">
    <a [href]="isDoctor ? '/indexDoctores' : '/index'" class="inline-flex items-center gap-2 min-h-touch rounded-control text-brand-600"
      aria-label="Jakarta, ir al inicio">
      <svg width="23" height="30" viewBox="0 0 23 30" fill="none" xmlns="http://www.w3.org/2000/svg" class="shrink-0" aria-hidden="true" focusable="false">
        <path fill-rule="evenodd" clip-rule="evenodd" [attr.d]="svg.logo" fill="currentColor" />
      </svg>
      <span class="text-h3 font-bold">Jakarta</span>
    </a>
  </div>

  <nav aria-label="Menú principal" class="flex flex-col flex-1 mt-8">
    <ul class="space-y-1">
      <!-- Panel de control -->
      <li>
        <a class="nav-item" [attr.aria-current]="panel ? 'page' : null" [href]="isDoctor ? '/indexDoctores' : '/index'">
          <svg class="w-6 h-6 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="svg.panelDeControl" />
          </svg>
          <span>Panel de control</span>
        </a>
      </li>

      <!-- Añadir doctor (solo administradores) -->
      <li *ngIf="isUsuario && usuario.rol === 'admin'">
        <button type="button" (click)="abrirFormularioNewDoctor()" id="newDoctor" aria-haspopup="dialog" class="nav-item w-full">
          <svg class="w-6 h-6 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" [attr.d]="svg.newDoctor1" />
            <path fill="currentColor" fill-rule="evenodd" [attr.d]="svg.newDoctor2" clip-rule="evenodd" />
          </svg>
          <span>Añadir doctor</span>
        </button>
      </li>

      <!-- Disponibilidad (solo doctores) -->
      <li *ngIf="isDoctor">
        <button type="button" (click)="abrirFormularioDisponibilidad()" id="disponibilidad" aria-haspopup="dialog" class="nav-item w-full">
          <svg class="w-6 h-6 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" [attr.d]="svg.disponibilidad1" />
            <path fill="currentColor" [attr.d]="svg.disponibilidad2" />
          </svg>
          <span>Disponibilidad</span>
        </button>
      </li>

      <!-- Horario (solo doctores) -->
      <li *ngIf="isDoctor">
        <a class="nav-item" [attr.aria-current]="horario ? 'page' : null" href="/horario">
          <svg class="w-6 h-6 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" [attr.d]="svg.horario" />
          </svg>
          <span>Horario</span>
        </a>
      </li>

      <!-- Perfil -->
      <li>
        <a class="nav-item" [attr.aria-current]="perfil ? 'page' : null" href="/perfil">
          <svg class="w-6 h-6 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd">
              <path [attr.d]="svg.perfil1" />
              <path [attr.d]="svg.perfil2" />
            </g>
          </svg>
          <span>Perfil</span>
        </a>
      </li>

      <!-- Citas -->
      <li>
        <a class="nav-item" [attr.aria-current]="citas ? 'page' : null" href="/misCitasUsuario">
          <svg class="w-6 h-6 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" [attr.d]="svg.citas1" />
            <path fill="currentColor" fill-rule="evenodd" [attr.d]="svg.citas2" clip-rule="evenodd" />
            <path fill="currentColor" fill-rule="evenodd" [attr.d]="svg.citas3" clip-rule="evenodd" />
          </svg>
          <span>Citas</span>
        </a>
      </li>

      <!-- Ayuda -->
      <li>
        <button type="button" id="ayuda" aria-haspopup="dialog" class="nav-item w-full" (click)="open()">
          <svg class="w-6 h-6 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" [attr.d]="svg.ayuda" />
          </svg>
          <span>Ayuda</span>
        </button>
      </li>
    </ul>

    <!-- Cerrar sesión, al pie del menú -->
    <div class="mt-auto pt-6">
      <button type="button" (click)="logout()" class="nav-item w-full">
        <svg class="w-6 h-6 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" [attr.d]="svg.logout" />
        </svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </nav>
</aside>


<!-- Formulario de disponibilidad -->
@if (isFormularioDisponibilidadActivo) {
<app-form-disponibilidad (cambiarEstadoFormDisponibilidad)="cerrarFormularios($event)" [doctor]="doctor" />
}

<!-- Modal de alerta -->
@if (mensajeAlerta) {
<dialog appDialog role="alertdialog" (dialogCancel)="cerrarAlerta()" aria-labelledby="alert-titulo" aria-describedby="alert-message">
<div id="alert-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-ink-900/50 p-4">
  <div class="modal-panel max-w-md border-l-4 border-l-brand-500">
    <div class="flex items-start gap-3">
      <svg class="w-8 h-8 sm:w-10 sm:h-10 text-brand-600 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="svg.modalAlerta" />
      </svg>
      <div>
        <h2 id="alert-titulo" class="sr-only">Aviso</h2>
        <p id="alert-message" class="text-body font-medium text-ink-900">{{ mensajeAlerta }}</p>
      </div>
    </div>
    <button type="button" class="btn-primary mt-6 w-full" (click)="cerrarAlerta()">
      Cerrar
    </button>
  </div>
</div>
</dialog>
}

<!-- Formulario de nuevo doctor -->
@if (isFormularioNewDoctorActivo) {
<app-new-doctor (cambiarEstado)="cerrarFormularios($event)" />
}

<!-- Modal de Ayuda -->
@if (isOpen) {
<app-ayuda (cambiarEstado)="cerrarModal($event)" />
}
