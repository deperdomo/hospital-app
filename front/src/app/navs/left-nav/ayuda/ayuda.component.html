<dialog appDialog (dialogCancel)="enviarEstado()" aria-labelledby="ayuda-titulo">
<div class="modal-backdrop z-50 flex items-center justify-center overflow-y-auto p-4 backdrop-blur-sm">
  <div class="modal-panel max-w-2xl max-h-[calc(100vh-2rem)] overflow-y-auto">
    <button type="button" (click)="enviarEstado()" aria-label="Cerrar" class="btn-icon absolute right-3 top-3">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>

    <div class="flex items-center gap-3 pr-12">
      <span class="flex-none grid place-items-center w-11 h-11 rounded-full bg-brand-50 text-brand-600">
        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z"/></svg>
      </span>
      <h2 id="ayuda-titulo" class="modal-title">Ayuda de Hospital Jakarta</h2>
    </div>
    <p class="mt-3 text-ink-600">Elige un tema para ver cómo funciona.</p>

    <div class="mt-5 divide-y divide-line-subtle border-y border-line-subtle">
      @for (section of sections; track section.id) {
        <div>
          <h3 class="text-body font-semibold">
            <button type="button"
              class="w-full min-h-touch flex items-center justify-between gap-3 py-3 px-2 -mx-2 rounded-control text-left text-ink-900 hover:bg-surface-muted"
              [attr.aria-expanded]="activeSection === section.id"
              [attr.aria-controls]="'ayuda-panel-' + section.id"
              [id]="'ayuda-boton-' + section.id"
              (click)="toggleSection(section.id)">
              <span class="flex items-center gap-3">
                <svg class="w-5 h-5 shrink-0 text-brand-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" [attr.d]="section.icono"/></svg>
                {{ section.title }}
              </span>
              <svg class="w-5 h-5 shrink-0 text-ink-600 transition-transform duration-200" [class.rotate-180]="activeSection === section.id"
                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
            </button>
          </h3>
          <div [id]="'ayuda-panel-' + section.id" role="region" [attr.aria-labelledby]="'ayuda-boton-' + section.id"
            [hidden]="activeSection !== section.id" class="pb-4 pl-8 pr-2 text-ink-700">
            @if (section.puntos) {
              <p>{{ section.texto }}</p>
              <ul class="mt-2 list-disc pl-5 space-y-1 marker:text-brand-600">
                @for (punto of section.puntos; track punto) {
                  <li>{{ punto }}</li>
                }
              </ul>
            } @else {
              <p>{{ section.texto }}</p>
            }
          </div>
        </div>
      }
    </div>

    <div class="modal-actions">
      <button type="button" (click)="enviarEstado()" class="btn-primary w-full sm:w-auto">Cerrar ayuda</button>
    </div>
  </div>
</div>
</dialog>
