<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
  <!-- Filtro por estado: botones conmutables (aria-pressed), el estilo activo cuelga del propio aria-pressed -->
  <div class="grid grid-cols-3 gap-1 rounded-control border border-line-subtle bg-surface-muted p-1 md:inline-grid md:w-auto" role="group" aria-label="Filtrar citas">
    <button type="button" [attr.aria-pressed]="selectedButton === 'proxima'" (click)="onSelectButton('proxima'); listaCitasProximas()" class="filtro">
      Próximas
    </button>
    <button type="button" [attr.aria-pressed]="selectedButton === 'pasadas'" (click)="onSelectButton('pasadas'); listaCitasPasadas()" class="filtro">
      Pasadas
    </button>
    <button type="button" [attr.aria-pressed]="selectedButton === 'canceladas'" (click)="onSelectButton('canceladas'); listaCitasCanceladas()" class="filtro">
      Canceladas
    </button>
  </div>

  <div class="flex flex-col sm:flex-row sm:items-center gap-3">
    @if (selectedButton === 'proxima') {
      <select (change)="onMonthSelected($event)" aria-label="Filtrar citas por mes" class="input w-full sm:w-48 pr-8">
        <option *ngFor="let month of months; let i = index" [value]="month.monthNumber">{{ month.monthName }}</option>
      </select>
    }
    @if (isUsuario) {
      <a href="/listaDoctores" class="btn-primary w-full sm:w-auto">
        <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true" focusable="false"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        Pedir cita
      </a>
    }
  </div>
</div>
