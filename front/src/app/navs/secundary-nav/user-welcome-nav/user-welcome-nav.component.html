<div class="min-w-0">
  @if (isDoctor) {
    @if (sexo == 'masculino') {
      <p class="text-meta sm:text-body font-medium text-ink-600 break-words">Hola, Dr. {{ nombreApellido }}</p>
    } @else {
      <p class="text-meta sm:text-body font-medium text-ink-600 break-words">Hola, Dra. {{ nombreApellido }}</p>
    }
  }
  @if (isUsuario) {
    @if (sexo == 'masculino') {
      <p class="text-meta sm:text-body font-medium text-ink-600 break-words">Hola, Sr. {{ nombreApellido }}</p>
    } @else {
      <p class="text-meta sm:text-body font-medium text-ink-600 break-words">Hola, Sra. {{ nombreApellido }}</p>
    }
  }
  <h1 class="text-h3 sm:text-h2 lg:text-h1 text-ink-900 break-words">{{ titulo }}</h1>
</div>
