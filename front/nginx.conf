server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API: la barra final de proxy_pass quita el prefijo /api
    location /api/ {
        proxy_pass http://hospital-back:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Bundles con hash en el nombre: cache larga
    location ~* \.(?:js|css|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Imágenes de public/ (fotos de perfil): sin hash, cache moderada
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp)$ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA: rutas de Angular -> index.html (sin cache)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
